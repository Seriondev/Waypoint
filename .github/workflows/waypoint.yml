          cat > src/main/java/com/waypointmod/AddWaypointScreen.java <<'EOF'
          package com.waypointmod;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.gui.widget.ButtonWidget;
          import net.minecraft.client.gui.widget.TextFieldWidget;
          import net.minecraft.text.Text;

          // Tambah atau edit waypoint: nama, koordinat (kosong = posisi sekarang), warna, dimensi.
          public class AddWaypointScreen extends Screen {
              private final Screen parent;
              private final WaypointStore.Waypoint editing;

              private TextFieldWidget nameField;
              private TextFieldWidget xField;
              private TextFieldWidget yField;
              private TextFieldWidget zField;
              private ButtonWidget colorButton;
              private ButtonWidget dimButton;

              private int colorIndex = 0;
              private int dimIndex = 0;
              private String error = "";

              public AddWaypointScreen(Screen parent, WaypointStore.Waypoint editing) {
                  super(Text.literal(editing == null ? "Tambah Waypoint" : "Edit Waypoint"));
                  this.parent = parent;
                  this.editing = editing;
                  if (editing != null) {
                      for (int i = 0; i < WaypointStore.COLORS.length; i++) {
                          if (WaypointStore.COLORS[i] == editing.color) colorIndex = i;
                      }
                      dimIndex = Math.max(0, Dims.indexOf(editing.dim));
                  } else {
                      dimIndex = Math.max(0, Dims.indexOf(Dims.current(MinecraftClient.getInstance())));
                  }
              }

              private Text colorLabel() {
                  return Text.literal("Warna: " + WaypointStore.COLOR_NAMES[colorIndex]);
              }

              private Text dimLabel() {
                  return Text.literal("Dimensi: " + Dims.NAMES[dimIndex]);
              }

              private TextFieldWidget coordField(int x, int y, int w, String label, String placeholder, String initial) {
                  TextFieldWidget f = new TextFieldWidget(this.textRenderer, x, y, w, 20, Text.literal(label));
                  f.setMaxLength(9);
                  f.setTextPredicate(s -> s.matches("-?\\d{0,8}"));
                  f.setPlaceholder(Text.literal(placeholder));
                  f.setText(initial);
                  this.addDrawableChild(f);
                  return f;
              }

              @Override
              protected void init() {
                  MinecraftClient mc = this.client;
                  int px = 0;
                  int py = 0;
                  int pz = 0;
                  if (mc != null && mc.player != null) {
                      px = (int) Math.floor(mc.player.getX());
                      py = (int) Math.floor(mc.player.getY());
                      pz = (int) Math.floor(mc.player.getZ());
                  }

                  int cw = Math.min(220, this.width - 20);
                  int x0 = this.width / 2 - cw / 2;
                  int y = this.height / 2 - 62;

                  nameField = new TextFieldWidget(this.textRenderer, x0, y, cw, 20, Text.literal("Nama"));
                  nameField.setMaxLength(24);
                  nameField.setPlaceholder(Text.literal("Nama waypoint"));
                  if (editing != null) nameField.setText(editing.name);
                  this.addDrawableChild(nameField);

                  int fw = (cw - 8) / 3;
                  xField = coordField(x0, y + 26, fw, "X", "X " + px, editing != null ? String.valueOf(editing.x) : "");
                  yField = coordField(x0 + fw + 4, y + 26, fw, "Y", "Y " + py, editing != null ? String.valueOf(editing.y) : "");
                  zField = coordField(x0 + (fw + 4) * 2, y + 26, fw, "Z", "Z " + pz, editing != null ? String.valueOf(editing.z) : "");

                  int half = (cw - 4) / 2;
                  colorButton = ButtonWidget.builder(colorLabel(), button -> {
                      colorIndex = (colorIndex + 1) % WaypointStore.COLORS.length;
                      button.setMessage(colorLabel());
                  }).dimensions(x0, y + 52, half, 20).build();
                  this.addDrawableChild(colorButton);

                  dimButton = ButtonWidget.builder(dimLabel(), button -> {
                      dimIndex = (dimIndex + 1) % Dims.IDS.length;
                      button.setMessage(dimLabel());
                  }).dimensions(x0 + half + 4, y + 52, half, 20).build();
                  this.addDrawableChild(dimButton);

                  this.addDrawableChild(ButtonWidget.builder(Text.literal("Simpan"), button -> save())
                      .dimensions(x0, y + 80, half, 20).build());
                  this.addDrawableChild(ButtonWidget.builder(Text.literal("Batal"), button -> this.close())
                      .dimensions(x0 + half + 4, y + 80, half, 20).build());
              }

              private static Integer parse(TextFieldWidget f) {
                  String t = f.getText().trim();
                  if (t.isEmpty() || t.equals("-")) return null;
                  try {
                      return Integer.parseInt(t);
                  } catch (NumberFormatException e) {
                      return null;
                  }
              }

              private void save() {
                  MinecraftClient mc = this.client;
                  if (mc == null || mc.player == null || mc.world == null) {
                      this.close();
                      return;
                  }
                  String dim = Dims.IDS[dimIndex];
                  boolean sameDim = dim.equals(Dims.current(mc));

                  Integer x = parse(xField);
                  Integer y = parse(yField);
                  Integer z = parse(zField);
                  if ((x == null || y == null || z == null) && !sameDim) {
                      error = "Isi X, Y, Z untuk dimensi lain";
                      return;
                  }
                  // Kolom kosong = posisi tempat berdiri sekarang.
                  if (x == null) x = (int) Math.floor(mc.player.getX());
                  if (y == null) y = (int) Math.floor(mc.player.getY());
                  if (z == null) z = (int) Math.floor(mc.player.getZ());

                  String name = nameField.getText().trim();
                  if (name.isEmpty()) {
                      name = "Waypoint " + (WaypointStore.all(mc).size() + 1);
                  }

                  WaypointStore.Waypoint w = editing != null ? editing : new WaypointStore.Waypoint();
                  w.name = name;
                  w.x = x;
                  w.y = y;
                  w.z = z;
                  w.color = WaypointStore.COLORS[colorIndex];
                  w.dim = dim;

                  if (editing == null) {
                      WaypointStore.add(mc, w);
                  } else {
                      WaypointStore.save(mc);
                  }
                  this.close();
              }

              @Override
              public void render(DrawContext context, int mouseX, int mouseY, float delta) {
                  super.render(context, mouseX, mouseY, delta);
                  int cx = this.width / 2;
                  int top = this.height / 2 - 62;
                  context.drawCenteredTextWithShadow(this.textRenderer, this.title, cx, top - 16, 0xFFFFFFFF);
                  context.drawCenteredTextWithShadow(this.textRenderer,
                      Text.literal("Kosongkan X, Y, Z untuk memakai posisimu sekarang"), cx, top + 106, 0xFFAAAAAA);
                  if (!error.isEmpty()) {
                      context.drawCenteredTextWithShadow(this.textRenderer, Text.literal(error), cx, top + 118, 0xFFFF5555);
                  }
                  // Kotak kecil warna di dalam tombol warna.
                  if (colorButton != null) {
                      int bx = colorButton.getX() + colorButton.getWidth() - 14;
                      int by = colorButton.getY() + 5;
                      context.fill(bx - 1, by - 1, bx + 9, by + 11, 0xFF000000);
                      context.fill(bx, by, bx + 8, by + 10, 0xFF000000 | WaypointStore.COLORS[colorIndex]);
                  }
              }

              @Override
              public void close() {
                  if (this.client != null) {
                      this.client.setScreen(this.parent);
                  }
              }
          }
          EOF

          cat > src/main/java/com/waypointmod/WaypointListScreen.java <<'EOF'
          package com.waypointmod;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.gui.widget.ButtonWidget;
          import net.minecraft.text.Text;

          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;

          // Daftar waypoint dengan 3 tab: Overworld, Nether, The End.
          public class WaypointListScreen extends Screen {
              private static final int PER_PAGE = 4;
              // Tab terakhir diingat selama game berjalan. -1 = ikuti dimensi sekarang.
              private static int tab = -1;

              private final Screen parent;
              private final int page;
              private final List<WaypointStore.Waypoint> shown = new ArrayList<>();
              private final boolean[] armed = new boolean[PER_PAGE];

              public WaypointListScreen(Screen parent) {
                  this(parent, 0);
              }

              public WaypointListScreen(Screen parent, int page) {
                  super(Text.literal("Waypoint"));
                  this.parent = parent;
                  this.page = Math.max(0, page);
              }

              private int pages() {
                  return Math.max(1, (shown.size() + PER_PAGE - 1) / PER_PAGE);
              }

              private int curPage() {
                  return Math.min(page, pages() - 1);
              }

              @Override
              protected void init() {
                  MinecraftClient mc = this.client;
                  if (mc == null) return;
                  if (tab < 0) tab = Math.max(0, Dims.indexOf(Dims.current(mc)));

                  shown.clear();
                  for (WaypointStore.Waypoint w : WaypointStore.all(mc)) {
                      if (Dims.IDS[tab].equals(w.dim)) shown.add(w);
                  }

                  int cw = Math.min(280, this.width - 20);
                  int x0 = this.width / 2 - cw / 2;
                  int top = this.height / 2 - 92;

                  // Tab dimensi
                  int tw = (cw - 8) / 3;
                  for (int t = 0; t < Dims.IDS.length; t++) {
                      final int tt = t;
                      ButtonWidget b = ButtonWidget.builder(Text.literal(Dims.NAMES[t]), button -> {
                          tab = tt;
                          this.client.setScreen(new WaypointListScreen(this.parent, 0));
                      }).dimensions(x0 + t * (tw + 4), top, tw, 20).build();
                      b.active = t != tab;
                      this.addDrawableChild(b);
                  }

                  // Baris waypoint
                  int start = curPage() * PER_PAGE;
                  for (int i = 0; i < PER_PAGE; i++) {
                      int idx = start + i;
                      if (idx >= shown.size()) break;
                      final int row = i;
                      final WaypointStore.Waypoint w = shown.get(idx);
                      int ry = top + 28 + i * 28;

                      this.addDrawableChild(ButtonWidget.builder(Text.literal("Edit"), button ->
                          this.client.setScreen(new AddWaypointScreen(this, w)))
                          .dimensions(x0 + cw - 96, ry, 44, 20).build());

                      this.addDrawableChild(ButtonWidget.builder(Text.literal("Hapus"), button -> {
                          if (!armed[row]) {
                              armed[row] = true;
                              button.setMessage(Text.literal("Yakin?"));
                          } else {
                              WaypointStore.remove(this.client, w);
                              this.client.setScreen(new WaypointListScreen(this.parent, this.page));
                          }
                      }).dimensions(x0 + cw - 48, ry, 48, 20).build());
                  }

                  // Navigasi halaman
                  int navY = top + 28 + PER_PAGE * 28 + 2;
                  ButtonWidget prev = ButtonWidget.builder(Text.literal("<"), button ->
                      this.client.setScreen(new WaypointListScreen(this.parent, curPage() - 1)))
                      .dimensions(x0, navY, 40, 20).build();
                  prev.active = curPage() > 0;
                  this.addDrawableChild(prev);

                  ButtonWidget next = ButtonWidget.builder(Text.literal(">"), button ->
                      this.client.setScreen(new WaypointListScreen(this.parent, curPage() + 1)))
                      .dimensions(x0 + cw - 40, navY, 40, 20).build();
                  next.active = curPage() + 1 < pages();
                  this.addDrawableChild(next);

                  // Baris bawah: tambah dan tutup
                  int by = navY + 26;
                  int bw = (cw - 4) / 2;
                  this.addDrawableChild(ButtonWidget.builder(Text.literal("Tambah"), button ->
                      this.client.setScreen(new AddWaypointScreen(this, null)))
                      .dimensions(x0, by, bw, 20).build());

                  this.addDrawableChild(ButtonWidget.builder(Text.literal("Tutup"), button -> this.close())
                      .dimensions(x0 + bw + 4, by, bw, 20).build());

                  // Pojok kiri bawah layar: pengaturan marker
                  this.addDrawableChild(ButtonWidget.builder(Text.literal("Settings"), button ->
                      this.client.setScreen(new MarkerSettingsScreen(this)))
                      .dimensions(6, this.height - 26, 70, 20).build());
              }

              @Override
              public void render(DrawContext context, int mouseX, int mouseY, float delta) {
                  super.render(context, mouseX, mouseY, delta);
                  MinecraftClient mc = this.client;
                  int cw = Math.min(280, this.width - 20);
                  int x0 = this.width / 2 - cw / 2;
                  int top = this.height / 2 - 92;
                  int cx = this.width / 2;

                  context.drawCenteredTextWithShadow(this.textRenderer, this.title, cx, top - 14, 0xFFFFFFFF);

                  if (shown.isEmpty()) {
                      context.drawCenteredTextWithShadow(this.textRenderer,
                          Text.literal("Belum ada waypoint di dimensi ini."), cx, top + 40, 0xFFAAAAAA);
                  }

                  boolean sameDim = mc != null && mc.player != null && Dims.IDS[tab].equals(Dims.current(mc));
                  int start = curPage() * PER_PAGE;
                  for (int i = 0; i < PER_PAGE; i++) {
                      int idx = start + i;
                      if (idx >= shown.size()) break;
                      WaypointStore.Waypoint w = shown.get(idx);
                      int ry = top + 28 + i * 28;

                      // Kotak warna
                      context.fill(x0, ry + 1, x0 + 10, ry + 11, 0xFF000000);
                      context.fill(x0 + 1, ry + 2, x0 + 9, ry + 10, 0xFF000000 | w.color);

                      String name = this.textRenderer.trimToWidth(w.name, cw - 96 - 16);
                      context.drawText(this.textRenderer, Text.literal(name), x0 + 14, ry + 1, 0xFFFFFFFF, true);

                      String info = w.x + ", " + w.y + ", " + w.z;
                      if (sameDim) {
                          double dx = w.x + 0.5 - mc.player.getX();
                          double dy = w.y - mc.player.getY();
                          double dz = w.z + 0.5 - mc.player.getZ();
                          info += String.format(Locale.ROOT, "  (%d m)", Math.round(Math.sqrt(dx * dx + dy * dy + dz * dz)));
                      }
                      context.drawText(this.textRenderer, Text.literal(info), x0 + 14, ry + 12, 0xFFAAAAAA, true);
                  }

                  int navY = top + 28 + PER_PAGE * 28 + 2;
                  context.drawCenteredTextWithShadow(this.textRenderer,
                      Text.literal((curPage() + 1) + "/" + pages()), cx, navY + 6, 0xFFFFFFFF);
              }

              @Override
              public void close() {
                  if (this.client != null) {
                      this.client.setScreen(this.parent);
                  }
              }
          }
